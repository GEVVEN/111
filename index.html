<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            padding: 15px;
            text-align: center;
            color: white;
            flex-shrink: 0;
        }
        
        .header h1 { font-size: 24px; }
        
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        
        .msg {
            margin-bottom: 12px;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            font-size: 16px;
            line-height: 1.4;
        }
        
        .msg.user {
            background: #667eea;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        
        .msg.ai {
            background: rgba(255,255,255,0.95);
            color: #333;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        
        .msg img { max-width: 100%; border-radius: 10px; margin-top: 8px; }
        
        .input-box {
            padding: 12px 15px;
            background: rgba(255,255,255,0.2);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }
        
        #text {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            background: white;
        }
        
        .btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #sendBtn { background: #667eea; color: white; }
        #cameraBtn, #galleryBtn { background: rgba(255,255,255,0.3); }
        
        .preview {
            display: flex;
            gap: 8px;
            padding: 8px 15px;
            overflow-x: auto;
            flex-shrink: 0;
        }
        
        .preview img, .preview video {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        input[type="file"] { display: none; }
        
        .settings {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .settings.show { display: flex; }
        
        .settings-box {
            background: white;
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
        }
        
        .settings-box h2 { margin-bottom: 20px; text-align: center; }
        
        .settings-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }
        
        .save-btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        
        .close-settings {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 AI 助手</h1>
        <div style="font-size:13px;opacity:0.8;margin-top:5px;">文字 · 图片 · 视频 · 语音</div>
        <button onclick="openSettings()" style="position:absolute;right:15px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:24px;cursor:pointer;">⚙️</button>
    </div>
    
    <div class="chat" id="chat"></div>
    
    <div class="preview" id="preview"></div>
    
    <div class="input-box">
        <input type="file" id="cameraInput" accept="image/*;capture=environment" multiple>
        <input type="file" id="galleryInput" accept="image/*,video/*" multiple>
        
        <button class="btn" id="cameraBtn" onclick="document.getElementById('cameraInput').click()">📷</button>
        <button class="btn" id="galleryBtn" onclick="document.getElementById('galleryInput').click()">🖼️</button>
        <input type="text" id="text" placeholder="输入消息..." autocomplete="off">
        <button class="btn" id="sendBtn" onclick="send()">➤</button>
    </div>
    
    <div class="settings" id="settings">
        <span class="close-settings" onclick="closeSettings()">×</span>
        <div class="settings-box">
            <h2>⚙️ API 设置</h2>
            <input type="text" id="apiUrl" placeholder="API 地址">
            <input type="password" id="apiKey" placeholder="API Key">
            <select id="model" style="width:100%;padding:12px;margin-bottom:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;">
                <option value="gpt-4o-mini">GPT-4o Mini</option>
                <option value="gpt-4o">GPT-4o</option>
                <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
            </select>
            <button class="save-btn" onclick="saveSettings()">保存</button>
        </div>
    </div>
    
    <script>
        let settings = JSON.parse(localStorage.getItem('ai_settings')) || {
            apiUrl: 'https://api.openai.com/v1/chat/completions',
            apiKey: '',
            model: 'gpt-4o-mini'
        };
        let mediaFiles = [];
        let messages = [];
        
        document.getElementById('apiUrl').value = settings.apiUrl;
        document.getElementById('apiKey').value = settings.apiKey;
        document.getElementById('model').value = settings.model;
        
        document.getElementById('cameraInput').addEventListener('change', (e) => addMedia(e.target.files));
        document.getElementById('galleryInput').addEventListener('change', (e) => addMedia(e.target.files));
        
        document.getElementById('text').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') send();
        });
        
        function addMedia(files) {
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    mediaFiles.push({
                        type: file.type.startsWith('video/') ? 'video' : 'image',
                        data: e.target.result
                    });
                    updatePreview();
                };
                reader.readAsDataURL(file);
            });
            e.target.value = '';
        }
        
        function updatePreview() {
            const preview = document.getElementById('preview');
            preview.innerHTML = mediaFiles.map((m, i) => `
                <div style="position:relative;">
                    ${m.type === 'video' 
                        ? `<video src="${m.data}" muted></video>` 
                        : `<img src="${m.data}">`
                    }
                    <span onclick="removeMedia(${i})" style="position:absolute;top:-5px;right:-5px;background:red;color:white;border-radius:50%;width:18px;height:18px;text-align:center;font-size:12px;cursor:pointer;">×</span>
                </div>
            `).join('');
        }
        
        function removeMedia(i) {
            mediaFiles.splice(i, 1);
            updatePreview();
        }
        
        async function send() {
            const text = document.getElementById('text').value.trim();
            if (!text && mediaFiles.length === 0) return;
            
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            
            addMessage(text || '请描述这些图片', [...mediaFiles], 'user');
            
            messages.push({
                role: 'user',
                content: buildContent(text, mediaFiles)
            });
            
            document.getElementById('text').value = '';
            mediaFiles = [];
            updatePreview();
            
            showLoading();
            
            try {
                const res = await fetch(settings.apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${settings.apiKey}`
                    },
                    body: JSON.stringify({
                        model: settings.model,
                        messages: messages,
                        max_tokens: 1000
                    })
                });
                
                const data = await res.json();
                hideLoading();
                
                const reply = data.choices[0].message.content;
                messages.push({ role: 'assistant', content: reply });
                addMessage(reply, [], 'ai');
            } catch (e) {
                hideLoading();
                addMessage('❌ 请求失败: ' + e.message, [], 'ai');
            }
            
            sendBtn.disabled = false;
        }
        
        function buildContent(text, files) {
            if (!files || files.length === 0) return text;
            
            const content = [];
            files.forEach(f => {
                content.push({ type: 'image_url', image_url: { url: f.data } });
            });
            if (text) content.push({ type: 'text', text });
            else content.push({ type: 'text', text: '请描述这些图片' });
            
            return content.length === 1 ? content[0] : content;
        }
        
        function addMessage(text, files, sender) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            
            let html = files.map(f => 
                f.type === 'video' 
                    ? `<video src="${f.data}" controls style="max-width:100%;border-radius:10px;margin-top:5px;"></video>`
                    : `<img src="${f.data}" style="max-width:100%;border-radius:10px;margin-top:5px;">`
            ).join('');
            
            if (text) html += `<div>${text.replace(/\n/g, '<br>')}</div>`;
            
            div.innerHTML = html;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
        
        function showLoading() {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'msg ai';
            div.id = 'loading';
            div.innerHTML = '<div style="display:flex;gap:5px;"><span></span><span></span><span></span></div>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
        
        function hideLoading() {
            const l = document.getElementById('loading');
            if (l) l.remove();
        }
        
        function openSettings() {
            document.getElementById('settings').classList.add('show');
        }
        
        function closeSettings() {
            document.getElementById('settings').classList.remove('show');
        }
        
        function saveSettings() {
            settings = {
                apiUrl: document.getElementById('apiUrl').value.trim(),
                apiKey: document.getElementById('apiKey').value.trim(),
                model: document.getElementById('model').value
            };
            localStorage.setItem('ai_settings', JSON.stringify(settings));
            closeSettings();
            addMessage('✅ 设置已保存', [], 'ai');
        }
    </script>
</body>
</html>
