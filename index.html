<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AI 智能助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
        }
        
        .bg-blobs {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out;
        }
        
        .blob:nth-child(1) { width: 200px; height: 200px; background: #a8edea; top: 10%; left: -20px; }
        .blob:nth-child(2) { width: 180px; height: 180px; background: #fed6e3; top: 40%; right: -20px; animation-delay: -7s; }
        .blob:nth-child(3) { width: 150px; height: 150px; background: #ffecd2; bottom: 10%; left: 20%; animation-delay: -14s; }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.05); }
            66% { transform: translate(-20px, 30px) scale(0.95); }
        }
        
        .container {
            position: relative;
            z-index: 1;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: calc(12px + var(--safe-top)) 16px 12px;
            text-align: center;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.3);
            flex-shrink: 0;
        }
        
        .header h1 {
            font-size: 22px;
            color: #fff;
            font-weight: 600;
        }
        
        .header .subtitle {
            font-size: 11px;
            color: rgba(255,255,255,0.8);
            margin-top: 2px;
        }
        
        .settings-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.3);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 18px;
            cursor: pointer;
        }
        
        .chat-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }
        
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: messageIn 0.3s ease;
        }
        
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border-bottom-right-radius: 6px;
        }
        
        .message.ai {
            align-self: flex-start;
            background: rgba(255,255,255,0.9);
            color: #333;
            border-bottom-left-radius: 6px;
        }
        
        .message img, .message video {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 8px;
            display: block;
        }
        
        .image-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
            margin-top: 8px;
        }
        
        .image-grid img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .input-area {
            padding: 12px 16px calc(12px + var(--safe-bottom));
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.3);
            flex-shrink: 0;
        }
        
        .preview-area {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 0;
            margin-bottom: 8px;
        }
        
        .preview-area::-webkit-scrollbar { display: none; }
        
        .preview-item {
            position: relative;
            flex-shrink: 0;
            width: 64px;
            height: 64px;
        }
        
        .preview-item img, .preview-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.5);
        }
        
        .preview-remove {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ff3b30;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
        }
        
        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        
        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: flex-end;
            background: rgba(255,255,255,0.85);
            border-radius: 24px;
            padding: 8px 12px;
        }
        
        .input-wrapper textarea {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 16px;
            resize: none;
            max-height: 100px;
            outline: none;
            padding: 4px 6px;
        }
        
        .input-actions {
            display: flex;
            gap: 4px;
            padding-bottom: 4px;
        }
        
        .action-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .action-btn:active { background: rgba(0,0,0,0.1); }
        
        .send-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { opacity: 0.5; }
        
        /* 设置面板 */
        .settings-panel {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
        }
        
        .settings-panel.active { display: flex; }
        
        .settings-content {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 24px;
            width: 90%;
            max-width: 340px;
        }
        
        .settings-content h2 { margin-bottom: 20px; font-size: 18px; text-align: center; }
        
        .setting-item { margin-bottom: 14px; }
        
        .setting-item label {
            display: block;
            margin-bottom: 6px;
            color: #666;
            font-size: 13px;
        }
        
        .setting-item input, .setting-item select {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            background: #fff;
        }
        
        .save-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }
        
        #cameraInput, #fileInput { display: none; }
        
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 14px 18px;
            align-self: flex-start;
            background: rgba(255,255,255,0.9);
            border-radius: 18px;
            border-bottom-left-radius: 6px;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
        
        .recording { animation: pulse 1s infinite; color: #ff3b30 !important; }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        
        .error-tip {
            align-self: center;
            background: rgba(255,59,48,0.15);
            color: #d32f2f;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="bg-blobs">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>
    
    <div class="container">
        <div class="header">
            <h1>🤖 AI 智能助手</h1>
            <div class="subtitle">文字 · 图片 · 语音 · 视频</div>
            <button class="settings-btn" onclick="openSettings()">⚙️</button>
        </div>
        
        <div class="chat-area" id="chatArea">
            <div class="message ai">
                你好！我是 AI 助手，有什么可以帮你的吗？支持发送文字、图片、视频和语音哦～ 🎯
            </div>
        </div>
        
        <div class="input-area">
            <div class="preview-area" id="previewArea"></div>
            
            <div class="input-row">
                <div class="input-wrapper">
                    <textarea id="messageInput" rows="1" placeholder="输入消息..."></textarea>
                    <div class="input-actions">
                        <!-- 关键：capture="environment" 强制调用后置摄像头 -->
                        <button class="action-btn" onclick="triggerCamera()" title="拍照">📷</button>
                        <!-- 关键：accept 支持图片和视频，multiple 支持多选 -->
                        <button class="action-btn" onclick="triggerGallery()" title="相册">🖼️</button>
                        <button class="action-btn" id="voiceBtn" onclick="toggleVoice()" title="语音">🎤</button>
                    </div>
                </div>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>
    
    <!-- 核心修改：capture="environment" 强制后置摄像头，multiple 支持多选 -->
    <input type="file" id="cameraInput" accept="image/*;capture=environment" multiple>
    <input type="file" id="fileInput" accept="image/*,video/*" multiple>
    
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-content" style="position:relative;">
            <button class="close-btn" onclick="closeSettings()">✕</button>
            <h2>⚙️ API 设置</h2>
            <div class="setting-item">
                <label>API 地址</label>
                <input type="text" id="apiUrl" placeholder="https://api.openai.com/v1/chat/completions">
            </div>
            <div class="setting-item">
                <label>API Key</label>
                <input type="password" id="apiKey" placeholder="sk-...">
            </div>
            <div class="setting-item">
                <label>模型</label>
                <select id="model">
                    <option value="gpt-4o-mini">GPT-4o Mini（推荐）</option>
                    <option value="gpt-4o">GPT-4o</option>
                    <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                </select>
            </div>
            <button class="save-btn" onclick="saveSettings()">保存设置</button>
        </div>
    </div>
    
    <script>
        let settings = JSON.parse(localStorage.getItem('ai_settings')) || {
            apiUrl: 'https://api.openai.com/v1/chat/completions',
            apiKey: '',
            model: 'gpt-4o-mini'
        };
        let mediaFiles = [];
        let isRecording = false;
        let recognition = null;
        let isLoading = false;
        let messageHistory = [];
        
        function init() {
            document.getElementById('apiUrl').value = settings.apiUrl;
            document.getElementById('apiKey').value = settings.apiKey;
            document.getElementById('model').value = settings.model;
            
            const textarea = document.getElementById('messageInput');
            textarea.addEventListener('input', autoResize);
            textarea.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // 关键：同时监听 cameraInput 和 fileInput
            document.getElementById('cameraInput').addEventListener('change', handleFiles);
            document.getElementById('fileInput').addEventListener('change', handleFiles);
            
            document.getElementById('settingsPanel').addEventListener('click', function(e) {
                if (e.target === this) closeSettings();
            });
        }
        
        function autoResize() {
            const textarea = document.getElementById('messageInput');
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
        }
        
        // 触发相机 - 直接点击 input
        function triggerCamera() {
            document.getElementById('cameraInput').click();
        }
        
        // 触发相册
        function triggerGallery() {
            document.getElementById('fileInput').click();
        }
        
        // 处理文件 - 支持多图多视频
        function handleFiles(e) {
            const files = Array.from(e.target.files);
            console.log('选择文件:', files.length, '个');
            
            files.forEach(file => {
                console.log('处理文件:', file.name, file.type);
                
                if (file.type.startsWith('image/') || file.type.startsWith('video/')) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const fileType = file.type.startsWith('video/') ? 'video' : 'image';
                        mediaFiles.push({
                            type: fileType,
                            data: event.target.result,
                            name: file.name
                        });
                        updatePreview();
                        console.log('当前媒体数量:', mediaFiles.length);
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            // 关键：清空 input 以允许重复选择同一文件
            e.target.value = '';
        }
        
        function updatePreview() {
            const previewArea = document.getElementById('previewArea');
            previewArea.innerHTML = mediaFiles.map((file, index) => `
                <div class="preview-item">
                    ${file.type === 'video' 
                        ? `<video src="${file.data}" muted playsinline></video>`
                        : `<img src="${file.data}" alt="${file.name}">`
                    }
                    <button class="preview-remove" onclick="removeMedia(${index})">✕</button>
                </div>
            `).join('');
            previewArea.scrollLeft = previewArea.scrollWidth;
        }
        
        function removeMedia(index) {
            mediaFiles.splice(index, 1);
            updatePreview();
        }
        
        async function sendMessage() {
            if (isLoading) return;
            
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message && mediaFiles.length === 0) return;
            
            console.log('发送消息:', message, '媒体数:', mediaFiles.length);
            
            isLoading = true;
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            
            // 保存历史
            messageHistory.push({
                role: 'user',
                content: buildContent(message, mediaFiles)
            });
            
            addMessage(message, [...mediaFiles], 'user');
            
            input.value = '';
            input.style.height = 'auto';
            mediaFiles = [];
            updatePreview();
            
            showLoading();
            
            try {
                const response = await callAI();
                hideLoading();
                
                messageHistory.push({ role: 'assistant', content: response });
                addMessage(response, [], 'ai');
            } catch (error) {
                hideLoading();
                showError(error.message || '请求失败');
                console.error('API 错误:', error);
            }
            
            isLoading = false;
            sendBtn.disabled = false;
        }
        
        function buildContent(text, files) {
            let content = [];
            
            if (files && files.length > 0) {
                files.forEach(file => {
                    content.push({
                        type: 'image_url',
                        image_url: { url: file.data }
                    });
                });
            }
            
            if (text) {
                content.push({ type: 'text', text: text });
            } else if (files && files.length > 0) {
                content.push({ type: 'text', text: '请描述这些图片的内容' });
            }
            
            return content.length === 1 ? content[0] : content;
        }
        
        async function callAI() {
            const systemPrompt = localStorage.getItem('system_prompt') || '你是一个有用的AI助手。';
            
            const messages = [
                { role: 'system', content: systemPrompt },
                ...messageHistory
            ];
            
            const response = await fetch(settings.apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${settings.apiKey}`
                },
                body: JSON.stringify({
                    model: settings.model,
                    messages: messages,
                    max_tokens: 1500,
                    temperature: 0.7
                })
            });
            
            if (!response.ok) {
                let errorData;
                try {
                    errorData = await response.json();
                } catch (e) {
                    errorData = {};
                }
                throw new Error(errorData.error?.message || `HTTP ${response.status}`);
            }
            
            const data = await response.json();
            return data.choices?.[0]?.message?.content || '抱歉，没有收到回复';
        }
        
        function addMessage(text, files, sender) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            let html = '';
            
            if (files && files.length > 0) {
                if (files.length === 1) {
                    const file = files[0];
                    if (file.type === 'video') {
                        html += `<video src="${file.data}" controls playsinline style="max-width:100%;border-radius:12px;margin-top:8px;"></video>`;
                    } else {
                        html += `<img src="${file.data}" style="max-width:100%;border-radius:12px;margin-top:8px;">`;
                    }
                } else {
                    const imageFiles = files.filter(f => f.type === 'image');
                    if (imageFiles.length > 0) {
                        html += '<div class="image-grid">';
                        imageFiles.forEach(file => {
                            html += `<img src="${file.data}">`;
                        });
                        html += '</div>';
                    }
                }
            }
            
            if (text) {
                html += `<div>${formatText(text)}</div>`;
            }
            
            messageDiv.innerHTML = html;
            chatArea.appendChild(messageDiv);
            scrollToBottom();
        }
        
        function formatText(text) {
            if (!text) return '';
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\n/g, '<br>');
        }
        
        function scrollToBottom() {
            const chatArea = document.getElementById('chatArea');
            setTimeout(() => {
                chatArea.scrollTop = chatArea.scrollHeight;
            }, 50);
        }
        
        function showLoading() {
            const chatArea = document.getElementById('chatArea');
            const loading = document.createElement('div');
            loading.className = 'typing-indicator';
            loading.id = 'loading';
            loading.innerHTML = '<span></span><span></span><span></span>';
            chatArea.appendChild(loading);
            scrollToBottom();
        }
        
        function hideLoading() {
            const loading = document.getElementById('loading');
            if (loading) loading.remove();
        }
        
        function showError(text) {
            const chatArea = document.getElementById('chatArea');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-tip';
            errorDiv.textContent = '❌ ' + text;
            chatArea.appendChild(errorDiv);
            scrollToBottom();
        }
        
        function toggleVoice() {
            const VoiceRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!VoiceRecognition) {
                alert('您的浏览器不支持语音识别，请使用 Safari 或 Chrome');
                return;
            }
            
            if (!recognition) {
                recognition = new VoiceRecognition();
                recognition.lang = 'zh-CN';
                recognition.continuous = false;
                recognition.interimResults = false;
                
                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    const input = document.getElementById('messageInput');
                    input.value += transcript;
                    autoResize();
                    input.focus();
                };
                
                recognition.onend = function() {
                    isRecording = false;
                    document.getElementById('voiceBtn').classList.remove('recording');
                };
                
                recognition.onerror = function(event) {
                    console.error('语音识别错误:', event.error);
                    isRecording = false;
                    document.getElementById('voiceBtn').classList.remove('recording');
                    
                    if (event.error === 'not-allowed') {
                        showError('请允许麦克风权限');
                    }
                };
            }
            
            if (isRecording) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                    isRecording = true;
                    document.getElementById('voiceBtn').classList.add('recording');
                } catch (e) {
                    console.error('启动语音识别失败:', e);
                }
            }
        }
        
        function openSettings() {
            document.getElementById('settingsPanel').classList.add('active');
        }
        
        function closeSettings() {
            document.getElementById('settingsPanel').classList.remove('active');
        }
        
        function saveSettings() {
            const apiUrl = document.getElementById('apiUrl').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const model = document.getElementById('model').value;
            
            if (!apiUrl) { alert('请输入 API 地址'); return; }
            if (!apiKey) { alert('请输入 API Key'); return; }
            
            settings = { apiUrl, apiKey, model };
            localStorage.setItem('ai_settings', JSON.stringify(settings));
            
            closeSettings();
            showError('✅ 设置已保存');
        }
        
        init();
    </script>
</body>
</html>
