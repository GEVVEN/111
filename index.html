<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 智能助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* 液态玻璃背景 */
        .bg-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out;
        }
        
        .blob:nth-child(1) {
            width: 300px;
            height: 300px;
            background: #a8edea;
            top: -50px;
            left: -50px;
            animation-delay: 0s;
        }
        
        .blob:nth-child(2) {
            width: 250px;
            height: 250px;
            background: #fed6e3;
            top: 40%;
            right: -50px;
            animation-delay: -5s;
        }
        
        .blob:nth-child(3) {
            width: 200px;
            height: 200px;
            background: #d4fc79;
            bottom: -50px;
            left: 30%;
            animation-delay: -10s;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -30px) scale(1.1); }
            50% { transform: translate(-20px, 50px) scale(0.9); }
            75% { transform: translate(-50px, -20px) scale(1.05); }
        }
        
        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 头部 */
        .header {
            padding: 15px 20px;
            text-align: center;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .header h1 {
            font-size: 24px;
            color: #333;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
        }
        
        .header .subtitle {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        
        /* 设置按钮 */
        .settings-btn {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.5);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }
        
        /* 聊天区域 */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: messageIn 0.3s ease;
        }
        
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-bottom-right-radius: 4px;
            color: #333;
        }
        
        .message.ai {
            align-self: flex-start;
            background: rgba(100, 200, 255, 0.3);
            backdrop-filter: blur(10px);
            border-bottom-left-radius: 4px;
            color: #333;
        }
        
        .message img, .message video {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 8px;
        }
        
        .message .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 5px;
            margin-top: 8px;
        }
        
        .message .image-grid img {
            width: 100%;
            height: 80px;
            object-fit: cover;
        }
        
        /* 输入区域 */
        .input-area {
            padding: 15px;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        
        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: flex-end;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 25px;
            padding: 8px 12px;
            backdrop-filter: blur(10px);
        }
        
        .input-wrapper textarea {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 16px;
            resize: none;
            max-height: 120px;
            outline: none;
            padding: 4px 8px;
        }
        
        .input-actions {
            display: flex;
            gap: 8px;
            padding-bottom: 4px;
        }
        
        .action-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.2s;
        }
        
        .action-btn:hover {
            background: rgba(0, 0, 0, 0.1);
        }
        
        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        
        .send-btn:active {
            transform: scale(0.95);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
        }
        
        /* 预览区域 */
        .preview-area {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            margin-bottom: 10px;
        }
        
        .preview-item {
            position: relative;
            flex-shrink: 0;
        }
        
        .preview-item img, .preview-item video {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        
        .preview-remove {
            position: absolute;
            top: -8px;
            right: -8px;
            background: rgba(255, 0, 0, 0.8);
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            color: white;
            font-size: 12px;
            cursor: pointer;
        }
        
        /* 设置面板 */
        .settings-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
        }
        
        .settings-panel.active {
            display: flex;
        }
        
        .settings-content {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(20px);
        }
        
        .settings-content h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .setting-item {
            margin-bottom: 15px;
        }
        
        .setting-item label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
        
        .setting-item input, .setting-item select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.6);
        }
        
        .save-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }
        
        /* 隐藏的文件输入 */
        #fileInput, #cameraInput {
            display: none;
        }
        
        /* 加载动画 */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 12px 16px;
            align-self: flex-start;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        
        /* 语音录制状态 */
        .recording {
            animation: pulse 1s infinite;
            color: #ff4444 !important;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <!-- 液态玻璃背景 -->
    <div class="bg-blobs">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>
    
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🤖 AI 智能助手</h1>
            <div class="subtitle">支持图片、语音输入</div>
            <button class="settings-btn" onclick="openSettings()">⚙️</button>
        </div>
        
        <!-- 聊天区域 -->
        <div class="chat-area" id="chatArea">
            <div class="message ai">
                你好！我是 AI 助手，有什么可以帮你的吗？支持发送文字、图片、视频和语音哦～ 🎯
            </div>
        </div>
        
        <!-- 输入区域 -->
        <div class="input-area">
            <!-- 预览区域 -->
            <div class="preview-area" id="previewArea"></div>
            
            <div class="input-row">
                <div class="input-wrapper">
                    <textarea id="messageInput" rows="1" placeholder="输入消息..."></textarea>
                    <div class="input-actions">
                        <!-- 相机按钮（直接调用摄像头） -->
                        <button class="action-btn" onclick="triggerCamera()" title="拍照">📷</button>
                        <!-- 相册按钮（选择多图/视频） -->
                        <button class="action-btn" onclick="triggerGallery()" title="选择媒体">🖼️</button>
                        <!-- 语音按钮 -->
                        <button class="action-btn" id="voiceBtn" onclick="toggleVoice()">🎤</button>
                    </div>
                </div>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>
    
    <!-- 隐藏的文件输入 -->
    <input type="file" id="cameraInput" accept="image/*;capture=environment" multiple>
    <input type="file" id="fileInput" accept="image/*,video/*" multiple>
    
    <!-- 设置面板 -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-content" style="position: relative;">
            <button class="close-btn" onclick="closeSettings()">✕</button>
            <h2>⚙️ API 设置</h2>
            <div class="setting-item">
                <label>API 地址</label>
                <input type="text" id="apiUrl" placeholder="https://api.openai.com/v1/chat/completions" value="">
            </div>
            <div class="setting-item">
                <label>API Key</label>
                <input type="password" id="apiKey" placeholder="sk-..." value="">
            </div>
            <div class="setting-item">
                <label>模型</label>
                <select id="model">
                    <option value="gpt-4o-mini">GPT-4o Mini（推荐）</option>
                    <option value="gpt-4o">GPT-4o</option>
                    <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                </select>
            </div>
            <button class="save-btn" onclick="saveSettings()">保存设置</button>
        </div>
    </div>
    
    <script>
        // 全局状态
        let settings = JSON.parse(localStorage.getItem('ai_settings')) || {
            apiUrl: 'https://api.openai.com/v1/chat/completions',
            apiKey: '',
            model: 'gpt-4o-mini'
        };
        let mediaFiles = [];
        let isRecording = false;
        let recognition = null;
        let isLoading = false;
        
        // 初始化
        document.getElementById('apiUrl').value = settings.apiUrl;
        document.getElementById('apiKey').value = settings.apiKey;
        document.getElementById('model').value = settings.model;
        
        // 自动调整输入框高度
        const textarea = document.getElementById('messageInput');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });
        
        // 监听回车发送
        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // 触发相机
        function triggerCamera() {
            document.getElementById('cameraInput').click();
        }
        
        // 触发相册
        function triggerGallery() {
            document.getElementById('fileInput').click();
        }
        
        // 处理文件选择
        document.getElementById('cameraInput').addEventListener('change', handleFiles);
        document.getElementById('fileInput').addEventListener('change', handleFiles);
        
        function handleFiles(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (file.type.startsWith('image/') || file.type.startsWith('video/')) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        mediaFiles.push({
                            type: file.type.startsWith('video/') ? 'video' : 'image',
                            data: event.target.result,
                            name: file.name
                        });
                        updatePreview();
                    };
                    reader.readAsDataURL(file);
                }
            });
            // 清空 input 以便重复选择同一文件
            e.target.value = '';
        }
        
        // 更新预览
        function updatePreview() {
            const previewArea = document.getElementById('previewArea');
            previewArea.innerHTML = mediaFiles.map((file, index) => `
                <div class="preview-item">
                    ${file.type === 'video' 
                        ? `<video src="${file.data}" muted></video>`
                        : `<img src="${file.data}" alt="${file.name}">`
                    }
                    <button class="preview-remove" onclick="removeMedia(${index})">✕</button>
                </div>
            `).join('');
        }
        
        // 移除媒体
        function removeMedia(index) {
            mediaFiles.splice(index, 1);
            updatePreview();
        }
        
        // 发送消息
        async function sendMessage() {
            if (isLoading) return;
            
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message && mediaFiles.length === 0) return;
            
            isLoading = true;
            document.getElementById('sendBtn').disabled = true;
            
            // 添加用户消息
            addMessage(message, mediaFiles, 'user');
            
            // 清空输入
            input.value = '';
            input.style.height = 'auto';
            mediaFiles = [];
            updatePreview();
            
            // 显示加载状态
            showLoading();
            
            try {
                const response = await callAI(message, mediaFiles);
                hideLoading();
                addMessage(response, [], 'ai');
            } catch (error) {
                hideLoading();
                addMessage('抱歉，请求失败：' + error.message, [], 'ai');
            }
            
            isLoading = false;
            document.getElementById('sendBtn').disabled = false;
        }
        
        // 调用 AI API
        async function callAI(message, files) {
            const messages = [];
            
            // 构建消息内容
            let content = [];
            
            if (files.length > 0) {
                files.forEach(file => {
                    content.push({
                        type: file.type,
                        image_url: { url: file.data }
                    });
                });
            }
            
            if (message) {
                content.push({ type: 'text', text: message });
            } else if (files.length > 0) {
                content.push({ type: 'text', text: '请描述这张/这些图片的内容' });
            }
            
            messages.push({ role: 'user', content: content });
            
            // 获取系统提示
            const systemPrompt = localStorage.getItem('system_prompt') || '你是一个有用的AI助手。';
            messages.unshift({ role: 'system', content: systemPrompt });
            
            const response = await fetch(settings.apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${settings.apiKey}`
                },
                body: JSON.stringify({
                    model: settings.model,
                    messages: messages,
                    max_tokens: 1000
                })
            });
            
            if (!response.ok) {
                const error = await response.json().catch(() => ({}));
                throw new Error(error.error?.message || `HTTP ${response.status}`);
            }
            
            const data = await response.json();
            return data.choices[0].message.content;
        }
        
        // 添加消息到聊天
        function addMessage(text, files, sender) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            let html = '';
            
            // 添加媒体
            if (files.length > 0) {
                if (files.length === 1) {
                    const file = files[0];
                    if (file.type === 'video') {
                        html += `<video src="${file.data}" controls style="max-width:100%;border-radius:10px;margin-top:8px;"></video>`;
                    } else {
                        html += `<img src="${file.data}" style="max-width:100%;border-radius:10px;margin-top:8px;">`;
                    }
                } else {
                    html += '<div class="image-grid">';
                    files.forEach(file => {
                        if (file.type === 'image') {
                            html += `<img src="${file.data}">`;
                        }
                    });
                    html += '</div>';
                }
            }
            
            // 添加文字
            if (text) {
                html += `<div>${formatText(text)}</div>`;
            }
            
            messageDiv.innerHTML = html;
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        // 格式化文本
        function formatText(text) {
            // 简单的 markdown 处理
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\n/g, '<br>');
        }
        
        // 显示加载状态
        function showLoading() {
            const chatArea = document.getElementById('chatArea');
            const loading = document.createElement('div');
            loading.className = 'typing-indicator';
            loading.id = 'loading';
            loading.innerHTML = '<span></span><span></span><span></span>';
            chatArea.appendChild(loading);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        // 隐藏加载状态
        function hideLoading() {
            const loading = document.getElementById('loading');
            if (loading) loading.remove();
        }
        
        // 语音输入
        function toggleVoice() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('您的浏览器不支持语音识别');
                return;
            }
            
            const VoiceRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!recognition) {
                recognition = new VoiceRecognition();
                recognition.lang = 'zh-CN';
                recognition.continuous = false;
                recognition.interimResults = false;
                
                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    document.getElementById('messageInput').value += transcript;
                };
                
                recognition.onend = function() {
                    document.getElementById('voiceBtn').classList.remove('recording');
                };
                
                recognition.onerror = function(event) {
                    console.error('语音识别错误:', event.error);
                    document.getElementById('voiceBtn').classList.remove('recording');
                };
            }
            
            if (isRecording) {
                recognition.stop();
                isRecording = false;
                document.getElementById('voiceBtn').classList.remove('recording');
            } else {
                recognition.start();
                isRecording = true;
                document.getElementById('voiceBtn').classList.add('recording');
            }
        }
        
        // 打开设置
        function openSettings() {
            document.getElementById('settingsPanel').classList.add('active');
        }
        
        // 关闭设置
        function closeSettings() {
            document.getElementById('settingsPanel').classList.remove('active');
        }
        
        // 保存设置
        function saveSettings() {
            settings.apiUrl = document.getElementById('apiUrl').value.trim();
            settings.apiKey = document.getElementById('apiKey').value.trim();
            settings.model = document.getElementById('model').value;
            
            localStorage.setItem('ai_settings', JSON.stringify(settings));
            localStorage.setItem('system_prompt', document.getElementById('systemPrompt').value || '你是一个有用的AI助手。');
            
            closeSettings();
            alert('设置已保存！');
        }
        
        // 点击面板外部关闭
        document.getElementById('settingsPanel').addEventListener('click', function(e) {
            if (e.target === this) closeSettings();
        });
    </script>
</body>
</html>
